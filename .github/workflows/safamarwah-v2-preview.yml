name: SafaMarwah v2 Preview
on:
  workflow_dispatch:
  push:
    branches: [safamarwah-v2-foundation]
    paths:
      - 'safamarwah-v2/**'
      - '.github/workflows/safamarwah-v2-preview.yml'
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build preview
        working-directory: safamarwah-v2
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish isolated preview branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: safamarwah-v2-preview
          publish_dir: ./safamarwah-v2/dist
          force_orphan: true
