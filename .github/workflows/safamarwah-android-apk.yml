name: SafaMarwah Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-capacitor/**'
      - 'index.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - '*.jpg'
      - '*.webp'
      - '.github/workflows/safamarwah-android-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # GitHub-hosted ubuntu-latest runners already include the Android SDK.\n      # Avoid setup-android action, which fails on this runner before npm begins.\n      - name: Verify Android SDK\n        run: |\n          echo \"ANDROID_HOME=$ANDROID_HOME\"\n          test -d \"$ANDROID_HOME\"\n          test -x \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" || find \"$ANDROID_HOME/cmdline-tools\" -name sdkmanager -type f | head -5\n          yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses > /dev/null || true
      - name: Install Capacitor dependencies
        working-directory: android-capacitor
        run: npm install --no-audit --no-fund
      - name: Create Android project and enable edge-to-edge
        working-directory: android-capacitor
        run: npm run android:init
      - name: Generate SafaMarwah launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 android-capacitor/scripts/generate-icons.py
      - name: Build debug APK
        working-directory: android-capacitor/android
        run: bash gradlew assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SafaMarwah-Android-debug-APK
          path: android-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
