name: SafaMarwah v2 Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [safamarwah-v2-foundation]
    paths:
      - 'safamarwah-v2/**'
      - '.github/workflows/safamarwah-v2-android.yml'
permissions:
  contents: read
jobs:
  android-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safamarwah-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safamarwah-v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web and Android dependencies
        run: |
          npm install --no-audit --no-fund
          npx cap --version
      - name: Build v2 web bundle
        run: npm run build
      - name: Create native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure Android status and navigation bars
        working-directory: safamarwah-v2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/res/values/styles.xml")
          data=p.read_text()
          marker='</resources>'
          style='''<style name="SafaMarwahNativeBars" parent="Theme.AppCompat.DayNight.NoActionBar">
              <item name="android:statusBarColor">#002f27</item>
              <item name="android:navigationBarColor">#002f27</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
              <item name="android:windowActionModeOverlay">true</item>
              <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
            </style>'''
          if marker not in data: raise SystemExit("Android styles.xml missing resources")
          data=data.replace(marker,style+'\n'+marker)
          p.write_text(data)
          PY
      - name: Build debug APK
        working-directory: safamarwah-v2/android
        run: bash gradlew assembleDebug
      - name: Upload SafaMarwah v2 test APK
        uses: actions/upload-artifact@v4
        with:
          name: SafaMarwah-v2-debug-APK
          path: safamarwah-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
