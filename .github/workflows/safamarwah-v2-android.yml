name: SafaMarwah v2 Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [safamarwah-v2-foundation]
    paths:
      - 'safamarwah-v2/**'
      - '.github/workflows/safamarwah-v2-android.yml'
permissions:
  contents: read
jobs:
  android-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safamarwah-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safamarwah-v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web and Android dependencies
        run: |
          npm install --no-audit --no-fund
          npx cap --version
      - name: Build v2 web bundle
        run: npm run build
      - name: Create native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply Android system-bar insets
        working-directory: safamarwah-v2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/java")
          candidates=list(p.rglob("MainActivity.java"))
          if len(candidates)!=1: raise SystemExit("Expected one MainActivity.java")
          file=candidates[0]
          data=file.read_text()
          if "androidx.core.view.WindowCompat" not in data:
              data=data.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\nimport androidx.core.view.WindowCompat;")
          data=data.replace("public class MainActivity extends BridgeActivity {}", """public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(android.os.Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              getWindow().setStatusBarColor(android.graphics.Color.rgb(0, 47, 39));
              getWindow().setNavigationBarColor(android.graphics.Color.rgb(0, 47, 39));
            }
          }""")
          if "setDecorFitsSystemWindows" not in data: raise SystemExit("MainActivity patch not applied")
          file.write_text(data)
          PY
      - name: Build debug APK
        working-directory: safamarwah-v2/android
        run: bash gradlew assembleDebug
      - name: Upload SafaMarwah v2 test APK
        uses: actions/upload-artifact@v4
        with:
          name: SafaMarwah-v2-debug-APK
          path: safamarwah-v2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
