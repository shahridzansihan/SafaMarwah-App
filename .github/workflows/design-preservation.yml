name: SafaMarwah design preservation checks
on:
  push:
    branches:
      - refactor/design-preservation-v1
  pull_request:
    paths:
      - index.html
      - scripts/check_design_preservation.py
      - .github/workflows/design-preservation.yml
jobs:
  static-design-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check design preservation invariants
        run: python3 scripts/check_design_preservation.py
