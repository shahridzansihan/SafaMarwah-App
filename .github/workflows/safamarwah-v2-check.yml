name: SafaMarwah v2 Build Check
on:
  push:
    branches: [safamarwah-v2-foundation]
    paths:
      - 'safamarwah-v2/**'
      - '.github/workflows/safamarwah-v2-check.yml'
  pull_request:
    paths:
      - 'safamarwah-v2/**'
      - '.github/workflows/safamarwah-v2-check.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safamarwah-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: safamarwah-v2-dist
          path: safamarwah-v2/dist
