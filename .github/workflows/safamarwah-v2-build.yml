name: SafaMarwah v2 Build Check
on:
  push:
    branches: [safamarwah-v2-foundation]
    paths:
      - 'safamarwah-v2/**'
      - '.github/workflows/safamarwah-v2-build.yml'
  pull_request:
    paths:
      - 'safamarwah-v2/**'
      - '.github/workflows/safamarwah-v2-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safamarwah-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and production build
        run: npm run build
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run navigation and responsive smoke tests
        run: npm run test:e2e
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: safamarwah-v2-dist
          path: safamarwah-v2/dist/
