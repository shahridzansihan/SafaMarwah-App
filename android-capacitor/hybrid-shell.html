<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002b23"><title>SafaMarwah</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#002b23;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#002b23}
#notice{position:fixed;z-index:3;bottom:calc(82px + env(safe-area-inset-bottom,0px));left:12px;right:12px;background:#073e33;color:#fff;border:1px solid #a7a06a;border-radius:14px;padding:12px 16px;font-size:13px;text-align:center;box-shadow:0 8px 24px #0005;display:none}
#notice button{background:transparent;border:0;color:#f1db99;font-weight:bold;margin-left:8px}
</style></head><body>
<iframe id="app" title="SafaMarwah Umrah Companion" src="./offline.html" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="notice" role="status"><span id="message"></span><button id="retry" type="button">Cuba lagi</button></div>
<script>
/* Live webapp first; use bundled snapshot only when offline or handshake fails. */
(()=>{
'use strict';
const frame=document.getElementById('app');
const notice=document.getElementById('notice');
const message=document.getElementById('message');
const retry=document.getElementById('retry');
const onlineUrl='https://app.safamarwah.my/';
const onlineOrigin=new URL(onlineUrl).origin;
let timer=null;
let active=false;
function offline(){
  if(active)return;
  clearTimeout(timer);
  frame.src='./offline.html';
  message.textContent='Paparan luar talian. Sambung internet dan tekan Cuba lagi untuk kemas kini.';
  notice.style.display='block';
}
function online(){
  active=false;
  clearTimeout(timer);
  if(!navigator.onLine){offline();return;}
  notice.style.display='none';
  frame.src=onlineUrl;
  // A loaded iframe is not proof that the remote site rendered.
  // Require an origin-checked response from the website.
  timer=setTimeout(offline,10000);
  frame.onload=()=>{
    if(active || !frame.src.startsWith(onlineOrigin))return;
    try{frame.contentWindow.postMessage({type:'safamarwah-shell-ping'},onlineOrigin);}catch(e){}
  };
}
window.addEventListener('message',event=>{
  if(event.origin!==onlineOrigin || event.source!==frame.contentWindow)return;
  if(event.data && event.data.type==='safamarwah-shell-pong'){
    active=true;clearTimeout(timer);notice.style.display='none';
  }
});
retry.addEventListener('click',online);
window.addEventListener('online',()=>{if(!active)online();});
window.addEventListener('offline',()=>{if(!active)offline();});
online();
})();
</script></body></html>
